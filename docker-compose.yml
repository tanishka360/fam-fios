services:
  fam-fios-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fam_fios_app
    restart: unless-stopped
    # Share the host's network so boto3 can reach the EC2 instance-metadata service
    # (IMDSv2) for instance-role credentials without raising the hop limit.
    # Streamlit listens on host port 8501 directly. On Docker Desktop (Windows/Mac),
    # replace this with   ports: ["8501:8501"]   for local runs.
    network_mode: host
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      # Local time shown in the app (meal log, check-ins). EC2 servers default to UTC.
      - TZ=${TZ:-Asia/Kolkata}
      # Learner Lab only allows us-east-1 / us-west-2; override for your own account
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_S3_BUCKET_NAME=fam-fios-cloud-vault
      # Optional Indian DLT registration values for Amazon SNS SMS (leave empty if not registered)
      - SNS_SMS_SENDER_ID=${SNS_SMS_SENDER_ID:-}
      - SNS_SMS_ENTITY_ID=${SNS_SMS_ENTITY_ID:-}
      - SNS_SMS_TEMPLATE_ID=${SNS_SMS_TEMPLATE_ID:-}
      # Email OTP delivery (e.g. Gmail + App Password). Set these in a .env file next to
      # this compose file on the server — it's git-ignored, so secrets never reach GitHub.
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
    volumes:
      # Persistent local storage for sandbox S3 vault
      - famfios_storage:/app/backend/app/storage/s3_sandbox
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  famfios_storage:
    driver: local
